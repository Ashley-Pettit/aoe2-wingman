name: Publish Wingman Windows executable

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-release:
    if: ${{ !github.event.release.prerelease }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller Pillow numpy uiautomation winrt-runtime winrt-Windows.Media.Ocr winrt-Windows.Graphics.Imaging winrt-Windows.Storage.Streams winrt-Windows.Foundation winrt-Windows.Foundation.Collections winrt-Windows.Globalization
      - name: Prepare and validate Python source
        run: python packaging/prepare_build.py
      - name: Build Wingman.exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Wingman --collect-all winrt --collect-all uiautomation --hidden-import=PIL.ImageTk --hidden-import=winrt.windows.media.ocr --hidden-import=winrt.windows.graphics.imaging --hidden-import=winrt.windows.storage.streams --hidden-import=winrt.windows.foundation --hidden-import=winrt.windows.foundation.collections --hidden-import=winrt.windows.globalization build/wingman_frozen.py
      - name: Check executable
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/Wingman.exe')) { throw 'Missing executable' }
          if ((Get-Item 'dist/Wingman.exe').Length -lt 1000000) { throw 'Unexpectedly small executable' }
      - name: Test Windows startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/Wingman.exe').Path
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 12
            $proc.Refresh()
            if ($proc.HasExited) {
              throw "Wingman exited during startup (exit code $($proc.ExitCode))"
            }
            Write-Host "Wingman stayed running for 12 seconds."
          }
          finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Attach executable to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:RELEASE_TAG" "dist/Wingman.exe" --clobber --repo "$env:GITHUB_REPOSITORY"
