name: Experimental Windows Wingman build

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'AoE2 Wingman.bat'
      - 'packaging/**'
      - '.github/workflows/windows-executable.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller Pillow numpy uiautomation winrt-runtime winrt-Windows.Media.Ocr winrt-Windows.Graphics.Imaging winrt-Windows.Storage.Streams winrt-Windows.Foundation winrt-Windows.Foundation.Collections winrt-Windows.Globalization
      - name: Extract and syntax check
        run: python packaging/prepare_build.py
      - name: Build executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Wingman --collect-all winrt --collect-all uiautomation --hidden-import=PIL.ImageTk --hidden-import=winrt.windows.media.ocr --hidden-import=winrt.windows.graphics.imaging --hidden-import=winrt.windows.storage.streams --hidden-import=winrt.windows.foundation --hidden-import=winrt.windows.foundation.collections --hidden-import=winrt.windows.globalization build/wingman_frozen.py
      - name: Check output
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/Wingman.exe')) { throw 'Missing executable' }
          if ((Get-Item 'dist/Wingman.exe').Length -lt 1000000) { throw 'Unexpectedly small executable' }
      - name: Smoke test Windows startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/Wingman.exe').Path
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 12
            $proc.Refresh()
            if ($proc.HasExited) {
              throw "Wingman exited during the 12-second startup smoke test with exit code $($proc.ExitCode)"
            }
            Write-Host "Wingman remained running for 12 seconds (PID $($proc.Id))."
          }
          finally {
            if (!$proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Wingman-Windows-experimental
          path: dist/Wingman.exe
